<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="beerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F7A41D"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3C4"/>
    </linearGradient>
  </defs>

  <rect x="40" y="70" width="100" height="150" rx="10" fill="#e0e0e0" stroke="#999" stroke-width="3"/>
  <rect x="140" y="110" width="40" height="70" rx="15" fill="none" stroke="#999" stroke-width="8"/>
  <clipPath id="cupClip">
    <rect x="45" y="75" width="90" height="140" rx="6"/>
  </clipPath>

  <g clip-path="url(#cupClip)">
    <rect x="40" y="90" width="100" height="130" fill="url(#beerGrad)"/>
    <path fill="#F7A41D" opacity="0.6">
      <animate attributeName="d" dur="2s" repeatCount="indefinite"
        values="M40,110 Q65,100 90,110 T140,110 L140,220 L40,220 Z;
                M40,110 Q65,120 90,110 T140,110 L140,220 L40,220 Z;
                M40,110 Q65,100 90,110 T140,110 L140,220 L40,220 Z"/>
    </path>
  </g>

  <circle cx="70" cy="85" r="6" fill="url(#foamGrad)">
    <animate attributeName="cy" values="85;88;85" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="80" r="8" fill="url(#foamGrad)">
    <animate attributeName="cy" values="80;84;80" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="85" r="6" fill="url(#foamGrad)">
    <animate attributeName="cy" values="85;89;85" dur="1.3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="65" cy="180" r="2" fill="#FFF8DC" opacity="0.8">
    <animate attributeName="cy" values="200;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="180" r="3" fill="#FFF8DC" opacity="0.8">
    <animate attributeName="cy" values="200;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="180" r="2" fill="#FFF8DC" opacity="0.8">
    <animate attributeName="cy" values="200;90" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <ellipse cx="40" cy="72" rx="20" ry="10" fill="url(#foamGrad)"/>
  <ellipse cx="80" cy="68" rx="25" ry="12" fill="url(#foamGrad)"/>
  <ellipse cx="120" cy="70" rx="22" ry="11" fill="url(#foamGrad)"/>
  <ellipse cx="140" cy="75" rx="15" ry="9" fill="url(#foamGrad)"/>

  <text x="100" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#F7A41D">Cheers! 🍺</text>
</svg>
